name: Build and review Astro site

on:
  push:
    branches: [main, agent/pinwheel-foundation, agent/import-real-pinwheel]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check and build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Serve built site and capture homepage
        run: |
          rm -rf preview-root
          mkdir -p preview-root/study-abroad-pinwheel
          cp -R dist/. preview-root/study-abroad-pinwheel/
          python3 -m http.server 8080 --directory preview-root > /tmp/http-server.log 2>&1 &
          npx wait-on --timeout 30000 http://127.0.0.1:8080/study-abroad-pinwheel/
          npx playwright screenshot --viewport-size=1536,1024 --full-page http://127.0.0.1:8080/study-abroad-pinwheel/ homepage.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: homepage-screenshot
          path: homepage.png
