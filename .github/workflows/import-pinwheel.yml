name: Import official Pinwheel source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-pinwheel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official Pinwheel source
        run: |
          git clone --depth 1 https://github.com/themefisher/pinwheel-astro.git /tmp/pinwheel
          rm -rf /tmp/pinwheel/.git

      - name: Create clean import branch
        run: |
          git checkout -B agent/import-real-pinwheel
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/pinwheel/. .

      - name: Configure GitHub Pages base path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('astro.config.mjs')
          s = p.read_text()
          if "site:" not in s:
              s = s.replace('export default defineConfig({', "export default defineConfig({\n  site: 'https://studyabroadcenter.github.io',\n  base: '/study-abroad-pinwheel',")
          p.write_text(s)
          PY

      - name: Preserve project workflows
        run: |
          git checkout main -- .github/workflows/pages.yml || true
          git checkout main -- .github/workflows/build.yml || true
          rm -f .github/workflows/import-pinwheel.yml

      - name: Commit official theme import
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import official Pinwheel Astro theme" || exit 0
          git push --force origin agent/import-real-pinwheel
